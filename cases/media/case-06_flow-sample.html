<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #F7F9FC;
    --ink: #1E293B;
    --muted: #475569;
    --rule: rgba(30,41,59,0.12);
    --fs: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', system-ui, sans-serif;
    --fd: 'Urbanist', 'Noto Sans JP', system-ui, sans-serif;
    --fm: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--fs); background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2.5rem 2rem;
  }
  .frame { max-width: 1680px; width: 100%; }
  .eyebrow {
    font-family: var(--fm); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--fd); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
    font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 0.35rem;
  }
  .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; }
  .wrap { overflow-x: auto; }
  svg { width: 100%; min-width: 1280px; display: block; }
  svg text.t { font-family: var(--fs); }
  svg text.m { font-family: var(--fm); }
  footer {
    margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--rule);
    font-family: var(--fm); font-size: 0.66rem; letter-spacing: 0.1em; color: var(--muted);
  }
</style>
